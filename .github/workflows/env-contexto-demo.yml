name: Env Pipeline

on:
  push:
    branches: [ calculadora_web_tp3 ]

jobs:

  variables:
    name: Variaveis
    runs-on: ubuntu-latest
    steps:
      - name: Runner
        run: echo ${{ github.actor }}
      - name: OS
        run: echo ${{ runner.os }}
      - name : Variavel Env
        run: echo ${{vars.STAGE}}

  variables_dev:
    name: Variaveis (dev)
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Runner
        run: echo ${{ github.actor }}
      - name: OS
        run: echo ${{ runner.os }}
      - name : Variavel Env
        run: echo ${{vars.STAGE}}