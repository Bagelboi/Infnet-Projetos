name: Java CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"

  pull_request:
    paths:
      - "src/**"

  workflow_dispatch:

jobs:

  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4


  build:
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Maven
        run: mvn -B clean compile


  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Executar testes
        run: mvn test


  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar JAR
        run: mvn package


  deploy:
    runs-on: ubuntu-latest
    needs: [build, test, package]

    steps:
      - name: Deploy simulado
        run: echo "Deploy realizado com sucesso"
